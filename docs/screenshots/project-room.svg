<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Generic project room</title><desc id="desc">An illustrated study with project objective, timeline, resource shelf, notes, and AI handoff.</desc>
