<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Generic report archive and autosave workflow</title><desc id="desc">A calendar archive, complete report preview, provenance status, and visible autosave states.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#d9e0d4"/><stop offset="1" stop-color="#c3b39f"/></linearGradient><filter id="shadow"><feDropShadow dy="8" stdDeviation="12" flood-opacity=".18"/></filter></defs>
<rect width="1440" height="900" fill="url(#bg)"/><rect x="70" y="70" width="1300" height="760" rx="34" fill="#f4eee3" filter="url(#shadow)"/>
<g font-family="system-ui" fill="#443e38"><text x="120" y="135" font-size="34" font-weight="700">Report Archive</text><text x="120" y="172" font-size="19">Complete dated records with provenance and conflict-safe saving</text></g>
<g transform="translate(120 220)"><rect width="420" height="520" rx="20" fill="#d4c4ad"/><text x="42" y="58" font-family="system-ui" font-size="26" font-weight="700" fill="#4c433a">October</text><g font-family="system-ui" font-size="17" fill="#6c5e51"><text x="42" y="105">MON</text><text x="98" y="105">TUE</text><text x="154" y="105">WED</text><text x="218" y="105">THU</text><text x="280" y="105">FRI</text><text x="338" y="105">SAT</text></g><g fill="#efe6d8"><rect x="34" y="125" width="352" height="330" rx="14"/></g><g font-family="system-ui" font-size="19" fill="#5b5147"><text x="55" y="165">1</text><text x="110" y="165">2</text><text x="165" y="165">3</text><text x="220" y="165">4</text><text x="275" y="165">5</text><text x="330" y="165">6</text><text x="55" y="220">8</text><text x="105" y="220">9</text><text x="157" y="220">10</text><text x="214" y="220">11</text><text x="270" y="220">12</text><text x="327" y="220">13</text><text x="50" y="275">15</text><text x="105" y="275">16</text><text x="160" y="275">17</text><text x="215" y="275">18</text><text x="270" y="275">19</text><text x="325" y="275">20</text></g><circle cx="224" cy="328" r="25" fill="#789585"/><text x="224" y="335" text-anchor="middle" font-family="system-ui" font-size="18" fill="white">25</text><text x="44" y="497" font-family="system-ui" font-size="18" fill="#62564b">● daily report  ● weekly review</text></g>
<g transform="translate(590 220)"><rect width="710" height="405" rx="20" fill="#fffaf0" stroke="#b8a58d" stroke-width="4"/><g font-family="system-ui" fill="#4a423a"><text x="42" y="58" font-size="28" font-weight="700">Daily Brief · 25 October</text><text x="42" y="96" font-size="17">Source date: 2026-10-25 · Verification: complete</text><line x1="42" y1="124" x2="665" y2="124" stroke="#d5c8b7" stroke-width="3"/><text x="42" y="170" font-size="21" font-weight="700">Focus</text><text x="42" y="205" font-size="19">One clear priority with its supporting source.</text><text x="42" y="255" font-size="21" font-weight="700">Evidence</text><text x="42" y="290" font-size="19">The full body is retained; truncated imports are rejected.</text><text x="42" y="340" font-size="21" font-weight="700">Review</text><text x="42" y="375" font-size="19">The displayed copy remains separate after user edits.</text></g></g>
<g transform="translate(590 660)" font-family="system-ui"><rect width="165" height="70" rx="18" fill="#e3d5c2"/><circle cx="32" cy="35" r="10" fill="#b7976f"/><text x="55" y="43" font-size="18" fill="#51483f">Pending</text><rect x="180" width="165" height="70" rx="18" fill="#e3d5c2"/><circle cx="212" cy="35" r="10" fill="#d2a453"/><text x="235" y="43" font-size="18" fill="#51483f">Saving</text><rect x="360" width="165" height="70" rx="18" fill="#e3d5c2"/><circle cx="392" cy="35" r="10" fill="#6f9a7c"/><text x="415" y="43" font-size="18" fill="#51483f">Saved</text><rect x="540" width="170" height="70" rx="18" fill="#ead4ce"/><circle cx="572" cy="35" r="10" fill="#b66f67"/><text x="595" y="43" font-size="18" fill="#51483f">Conflict</text></g>
</svg>
