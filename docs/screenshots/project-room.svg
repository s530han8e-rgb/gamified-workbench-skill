<rect width="1440" height="900" fill="url(#wall)"/><rect y="650" width="1440" height="250" fill="#806149"/><path d="M0 700h1440M0 770h1440M0 840h1440" stroke="#6d513d" stroke-width="8"/>
<rect x="80" y="80" width="390" height="500" rx="16" fill="#644b3b" filter="url(#shadow)"/><g fill="#efe0c6"><rect x="112" y="120" width="326" height="110" rx="8"/><rect x="112" y="252" width="326" height="110" rx="8"/><rect x="112" y="384" width="326" height="160" rx="8"/></g><g font-family="system-ui" fill="#50443b"><text x="140" y="158" font-size="20">REFERENCE SHELF</text><text x="140" y="193" font-size="18">Sources · Attachments · Decisions</text><text x="140" y="290" font-size="20">PROJECT HISTORY</text><text x="140" y="325" font-size="18">Milestones · Feedback · Revisions</text><text x="140" y="422" font-size="20">NEXT ACTIONS</text><text x="140" y="460" font-size="18">☐ Review the current draft</text><text x="140" y="495" font-size="18">☐ Record one decision</text></g>
